# 图片对比 · macOS + Windows 双平台打包
#
# 前提：仓库根目录 = 本项目根（即 js/ 、src-tauri/ 、package.json 都在仓库根）。
# 若把本项目放进 monorepo 的子目录（如 mac-image-compare/），需要改两处：
#   1) 在 jobs.build 下加：  defaults: { run: { working-directory: mac-image-compare } }
#      并把下面所有路径前缀补上 mac-image-compare/（checkout 后 rust-cache 的 workspaces 同理）
#   2) push/pull_request 触发加 paths 过滤，避免整个 monorepo 的提交都触发打包
#
# 产物在 Actions 运行页底部的 Artifacts 区下载，未做代码签名，见文件末尾说明。

name: build-app

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false # 一个平台失败不影响另一个平台出包
      matrix:
        include:
          - os: macos-latest # GitHub 的 macos-latest 已是 Apple Silicon
            target: aarch64-apple-darwin
            bundles: app # 只打 .app：打 dmg 会偶发卡在 Finder AppleScript 超时
            artifact: image-compare-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: image-compare-windows-x64
          # Intel Mac 需要时取消注释（macos-13 是 Intel runner，会多占一份 macOS 额度）
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   bundles: app
          #   artifact: image-compare-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # 前端是免构建的原生 ES module（frontendDist 直接指向 js/），所以只需装 CLI 依赖
      - name: Install deps
        run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # .app 直接上传会被 zip 丢掉可执行位和包结构，先 tar 保结构
      - name: Archive .app
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          tar -czf "out/${{ matrix.artifact }}.tgz" \
            -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" .
          ls -lh out

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*.tgz
          if-no-files-found: error

      # 产物文件名带中文（图片对比_0.1.0_x64-setup.exe），复制成 ASCII 名再上传，避免下载端文件名乱码
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" `
            "out/image-compare-setup.exe" -Force
          Get-ChildItem out

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*.exe
          if-no-files-found: error

  # 汇总一行产物大小，去 Actions 页面翻日志就能看清
  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: List artifacts
        run: |
          echo "构建完成，到本页面底部 Artifacts 下载："
          echo "  - image-compare-macos-arm64   (.app，解压后拖到「应用程序」)"
          echo "  - image-compare-windows-x64   (NSIS 安装包 .exe)"
