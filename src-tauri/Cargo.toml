[package]
name = "image-compare"
version = "0.2.1"
description = "图片对比 + 局域网文件/文字传输 + 文字收藏"
edition = "2021"

[lib]
name = "image_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }

# 局域网传输：服务端 / 客户端 / 服务发现 / 校验 / 设备身份
mdns-sd = "0.21"
tiny_http = "0.12"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
# 只用来做前端复制的最后一道兜底（WebView 拦下 clipboard API 时），不需要图片能力，
# 关掉默认特性可以避免拖进整套 image 解码依赖
arboard = { version = "3", default-features = false }
